<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><style>body{margin:0;font:15px system-ui;color:#222}label{display:grid;gap:8px}input{font:inherit;padding:10px;border:1px solid #ddd;border-radius:8px}button{margin-top:18px;padding:9px 20px;border:0;border-radius:8px;background:#007aff;color:white;font:inherit}output{margin-left:14px}</style><form><label>刷新间隔（毫秒）<input id="interval" type="number" min="100" max="60000" required></label><button>保存</button><output></output></form><script type="module">import{createClient}from'/sdk/streamui.js';const settings=createClient().settings('plugin','uptime');const data=await settings.read();document.querySelector('input').value=data.interval||1000;document.querySelector('form').onsubmit=async event=>{event.preventDefault();await settings.save({interval:Number(document.querySelector('input').value)});document.querySelector('output').textContent='已保存';};</script></html>

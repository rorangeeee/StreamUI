<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>StreamUI · RESCALING 转场</title><link rel="icon" href="/favicon.svg"/></head>
<body>
  <header class="transition-toolbar"><div><span class="transition-kicker">STREAMUI / STINGER</span><h1>RESCALING</h1></div><div class="transition-actions"><label>下一布局<select id="transition-target"><option value="16:9">16:9 · 全画布叠加</option><option value="21:9">21:9 · 超宽主画面</option></select></label><label class="transition-loop"><input id="transition-loop" type="checkbox" checked/>循环</label><button id="transition-replay" type="button">从头播放</button><button id="transition-pause" type="button">暂停</button></div></header>
  <main class="transition-preview"><div id="transition-viewport"><div id="transition-surface" aria-label="透明转场画面"></div></div></main>
  <section class="transition-controls" aria-label="时间轴"><div class="transition-readout"><span id="transition-phase">准备画面</span><output id="transition-time">0.000 s / 6.000 s</output></div><input id="transition-scrub" aria-label="转场时间" type="range" min="0" max="360" value="0" step="1"/><nav class="transition-cues" aria-label="分阶段查看"><button type="button" data-frame="30">01 像素铺屏</button><button type="button" data-frame="85">02 RESCALING</button><button type="button" data-frame="122">03 全屏高亮</button><button type="button" data-frame="170">04 隧道前进</button><button type="button" data-frame="300">05 布局形成</button><button type="button" data-frame="328">06 主画面开屏</button></nav><div class="transition-notes"><span>60 fps · OBS 切换点 <strong>第 60 帧 / 1000 ms</strong></span><span id="transition-font-status">正在加载 RETRO PIXEL</span></div><div class="transition-settings-actions"><button id="transition-load-host" type="button">读取当前 Host 的布局与标题</button><span id="transition-status" role="status">透明区域以棋盘格显示。点击“从头播放”查看完整转场。</span></div></section>
  <script type="module" src="/src/transition.ts"></script>
</body></html>

<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><style>body{margin:0;font:15px system-ui;color:#1d1d1f}label{display:grid;gap:9px}input{font:inherit;padding:10px 12px;border:1px solid #ddd;border-radius:8px}button{margin-top:18px;padding:9px 20px;border:0;border-radius:8px;background:#007aff;color:white;font:inherit}output{margin-left:15px}</style><form><label>标题<input id="title" required></label><button>保存</button><output id="status"></output></form><script type="module">
import{createClient}from'/sdk/streamui.js';const client=createClient(),settings=client.settings('scene','live');const values=await settings.read();document.querySelector('#title').value=values.title||'直播';
document.querySelector('form').onsubmit=async event=>{event.preventDefault();await settings.save({title:document.querySelector('#title').value});document.querySelector('#status').textContent='已保存';};
</script></html>

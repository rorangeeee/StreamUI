<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><script src="/config-appearance.js"></script><link rel="stylesheet" href="/config-theme.css"><style>body{margin:0;font:15px system-ui;color:var(--text)}label{display:grid;gap:9px}input{background:var(--field);color:var(--text);font:inherit;padding:10px 12px;border:1px solid var(--border);border-radius:8px}button{margin-top:18px;padding:9px 20px;border:0;border-radius:8px;background:var(--accent);color:white;font:inherit}output{margin-left:15px}</style><form><label>标题<input id="title" required></label><button>保存</button><output id="status"></output></form><script type="module">
import{createClient}from'/sdk/streamui.js';const client=createClient(),settings=client.settings('scene','live');const values=await settings.read();document.querySelector('#title').value=values.title||'直播';
document.querySelector('form').onsubmit=async event=>{event.preventDefault();await settings.save({title:document.querySelector('#title').value});document.querySelector('#status').textContent='已保存';};
</script></html>

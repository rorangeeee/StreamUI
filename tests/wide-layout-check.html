<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>StreamUI 16:9 layout verification</title>
<style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#111;color:#eee;font:14px system-ui}header{padding:16px;display:flex;gap:12px;align-items:center}button{padding:9px 15px;background:#292929;color:#fff;border:1px solid #555;cursor:pointer}#surface{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:linear-gradient(125deg,#edf2f0 0%,#d2b899 28%,#4c6b7b 48%,#1e2732 66%,#070b13 100%)}#surface:before{content:'TEST VIDEO BACKGROUND · 明暗对比测试';position:absolute;left:15%;top:40%;font:700 5vw system-ui;color:#fff5;max-width:65%;line-height:1.4}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}pre{white-space:pre-wrap;padding:20px;margin:0;font-size:13px}body[data-preview=true] header,body[data-preview=true] pre{display:none}
</style>
<header><button id="run">运行布局检查</button><button id="chat">显示测试弹幕</button><button id="gift">显示测试礼物</button><button id="history">显示终端历史</button><button id="preview">仅显示预览</button><span>隔离测试 · 背景模拟 OBS 下层视频</span></header>
<div id="surface"><iframe id="stage" src="/?edit=1"></iframe></div><pre id="results">等待运行</pre>
<script type="module">
const iframe=document.querySelector('#stage'), output=document.querySelector('#results');
const doc=()=>iframe.contentDocument, win=()=>iframe.contentWindow;
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const api=async(path,body)=>{const response=await fetch(path,{method:'PUT',headers:{'Content-Type':'application/json','X-StreamUI-Request':'1'},body:JSON.stringify(body)});if(!response.ok)throw Error(await response.text());return response.headers.get('content-type')?.includes('application/json')?response.json():null};
async function mode(value){await api('/api/layout-mode',{mode:value});for(let i=0;i<60;i++){if(doc()?.querySelector('#workspace')?.dataset.layoutMode===value){await delay(100);return}await delay(50)}throw Error('布局同步超时')}
let sequence=0;
function receive(type,values={}){const terminal=doc().querySelector(doc().querySelector('#workspace').dataset.layoutMode==='16:9'?'chat-history-terminal':'chat-terminal');const event={type,id:`wide-qa-${++sequence}`,origin:'local-wide-check',username:'测试用户 WHEN',userLvl:42,message:'这是一条覆盖在视频上的白色弹幕。Perspective CHAT — 保留阴影与表情 🎧',giftName:'小花花',timestamp:Date.now(),...values};terminal.receive(event);return event}
function settleHistory(){const terminal=doc().querySelector('chat-history-terminal');terminal.pause();terminal.playback.finish();terminal.render()}
function historyFixture(){const terminal=doc().querySelector('chat-history-terminal');terminal.pause();terminal.playback.clear();terminal.render();for(const [type,values] of [
['message',{username:'LATENITE',message:'今晚也一起听音乐。🎧'}],
['message',{username:'夜行者',message:'这个终端和外框一起倾斜，连续消息也能看清。'}],
['gift',{username:'WHEN',giftName:'小花花'}],
['message',{username:'NOIZBOIZ',message:'RETRO TERMINAL · 逐字打印 / 扫描线 / 历史滚动'}],
['superchat',{username:'HOPEFINDERS',priceNormalized:30,message:'支持 LATENITE，继续播放！'}],
['message',{username:'BASSKARYOTES',message:'低频准备就绪 🔊'}]
])receive(type,values);settleHistory()}
document.querySelector('#chat').onclick=()=>receive('message');document.querySelector('#gift').onclick=()=>receive('gift');
document.querySelector('#history').onclick=historyFixture;
document.querySelector('#preview').onclick=()=>{
  for(const wordmark of doc().querySelectorAll('kinetic-wordmark')){wordmark.constructor.playing.delete(wordmark);wordmark.render(0)}
  for(const animation of doc().getAnimations())animation.pause();
  doc().querySelector('now-playing').update({title:'夜行 LATENITE',artist:'When',playing:true,state:'playing'});
  document.body.dataset.preview='true';
};
document.querySelector('#run').onclick=async()=>{
const passed=[];const check=(value,name)=>{if(!value)throw Error(name);passed.push('PASS '+name)};const style=e=>win().getComputedStyle(e);
try{
await mode('21:9');await api('/api/layout',{mode:'21:9',layout:null});await api('/api/layout',{mode:'16:9',layout:null});await delay(200);
const title=doc().querySelector('#bilingual-title'),brand=doc().querySelector('.brand-wordmark'),single=doc().querySelector('chat-terminal'),terminal=doc().querySelector('chat-history-terminal'),track=doc().querySelector('now-playing'),barcode=doc().querySelector('barcode-code');
check(style(doc().querySelector('.stage-backdrop')).display!=='none','21:9 keeps its opaque surround and transparent aperture');
check(track.parentElement.id==='spectrogram-window','21:9 NOW PLAYING stays in its existing host');
check(style(single).display==='block'&&style(terminal).display==='none','21:9 displays only its original single-message component');
receive('message',{message:'21:9 单条弹幕保持原样'});single.pause();single.playback.advance(10000);single.render();const originalSingle=single.textContent;
await mode('16:9');await doc().fonts.ready;
for(const selector of ['.stage-backdrop','.stage-dividers','#spectrogram-window','#waveform-window','stream-metadata'])check(style(doc().querySelector(selector)).display==='none',selector+' hidden only in 16:9');
check(style(doc().querySelector('#chat-window')).backgroundColor==='rgba(0, 0, 0, 0)','CHAT background stays transparent');
check(style(terminal).display==='block'&&style(single).display==='none','16:9 displays only the scrolling terminal');
check(style(terminal).color==='rgb(255, 255, 255)'&&Number(style(terminal).fontWeight)>=500,'CHAT uses heavier white text');
check(style(doc().querySelector('.chat-projection')).transform.startsWith('matrix3d'),'frame, label and text share a perspective plane');
const first=new (win().DOMMatrix)(style(doc().querySelector('.chat-lift')).transform);await delay(250);const second=new (win().DOMMatrix)(style(doc().querySelector('.chat-lift')).transform);
check(first.m42===0&&second.m42===0&&Math.abs(first.m43-second.m43)>.01,'CHAT floats in 3D depth without translating on canvas Y');
check(track.parentElement.id==='workspace'&&track.classList.contains('wide-now-playing'),'existing NOW PLAYING instance moves above the footer');
check(style(title).filter.includes('drop-shadow')&&style(doc().querySelector('stream-marquee')).filter.includes('drop-shadow'),'title and footer use hard shadows');
check(doc().querySelector('#bilingual-title')===title&&doc().querySelector('.brand-wordmark')===brand&&doc().querySelector('chat-terminal')===single&&doc().querySelector('chat-history-terminal')===terminal&&doc().querySelector('barcode-code')===barcode,'all live animated component instances survive switching');
terminal.pause();terminal.playback.clear();terminal.render();receive('message',{message:'第一条终端消息'});terminal.pause();
check(terminal.querySelectorAll('.history-line').length===1,'the terminal prints the sending time first');
terminal.playback.advance(160);terminal.render();check(terminal.querySelector('.history-user').textContent.includes('UL 42'),'the second line restores username and user level');
terminal.playback.advance(10000);terminal.render();const duplicate=receive('gift');receive('superchat',{priceNormalized:30,message:'支持终端'});receive('message',{message:'最新消息 👨‍👩‍👧‍👦'});terminal.receive(duplicate);settleHistory();
check(terminal.querySelectorAll('.history-entry').length===4,'multiple messages, gifts and SC remain visible without duplicates');
check(terminal.querySelectorAll('.history-entry')[0].textContent.includes('第一条终端消息')&&terminal.querySelector('.history-entry:last-child').textContent.includes('最新消息 👨‍👩‍👧‍👦'),'terminal history preserves both earlier and latest messages');
const gift=terminal.querySelector('[data-kind=gift]'),sc=terminal.querySelector('[data-kind=superchat]');
check(style(gift).backgroundColor==='rgb(64, 0, 158)'&&style(gift).color==='rgb(0, 0, 0)'&&style(sc).backgroundColor===style(gift).backgroundColor&&sc.textContent.includes('[¥30]'),'gift and SC rows retain purple backgrounds and black text');
check(win().getComputedStyle(terminal,'::after').backgroundImage.includes('repeating-linear-gradient'),'the terminal restores its CRT scanline overlay');
check(style(terminal.querySelector('.history-line')).textShadow.includes('2px 2px 0px'),'regular messages keep a hard shadow plus terminal glow');
const lift=doc().querySelector('.chat-lift');check(terminal.closest('.chat-lift')===lift&&[terminal,terminal.querySelector('.history-viewport'),terminal.querySelector('.history-output'),...terminal.querySelectorAll('.history-line')].every(node=>style(node).transform==='none'),'terminal content and scanlines inherit the exact same perspective as the outer frame');
receive('message',{message:'<img src=x onerror=alert(1)> 仅作为文字显示'});settleHistory();check(!terminal.querySelector('img')&&terminal.textContent.includes('<img src=x'),'incoming terminal text cannot create HTML');
for(let i=0;i<25;i++)receive('message',{message:`滚动检查 ${i}：长消息自动折行，旧消息继续保留。`});settleHistory();
const viewport=terminal.querySelector('.history-viewport');check(viewport.scrollHeight>viewport.clientHeight&&Math.abs(viewport.scrollHeight-viewport.clientHeight-viewport.scrollTop)<2,'the long terminal scrolls to the newest completed message');
viewport.scrollTop=0;receive('message',{message:'查看历史时不抢走滚动位置'});settleHistory();check(viewport.scrollTop===0,'reading older messages is not interrupted by new arrivals');
viewport.scrollTop=viewport.scrollHeight;await delay(50);receive('message',{message:'回到列表底部后继续跟随最新弹幕'});settleHistory();
const atTail=()=>Math.abs(viewport.scrollHeight-viewport.clientHeight-viewport.scrollTop)<2;
check(atTail(),'scrolling back to the bottom resumes following new messages');
terminal.style.fontSize='44px';await delay(100);check(atTail(),'font reflow keeps the newest message visible even without new arrivals');
terminal.style.fontSize='';await delay(100);
lift.style.height='65%';await delay(100);check(atTail(),'shrinking the terminal keeps it at the newest message');
lift.style.height='';await delay(100);
lift.style.width='72%';await delay(100);check(atTail(),'wrapping after a width change keeps the newest message visible');
lift.style.width='';await delay(100);
for(let i=0;i<220;i++)receive('message',{message:`历史容量回归检查 ${i}`});settleHistory();
check(terminal.querySelectorAll('.history-entry').length===200&&atTail(),'trimming the history to 200 rows continues following the newest message');
track.update({title:'夜行 LATENITE',artist:'When',playing:true,state:'playing'});
await mode('21:9');check(doc().querySelector('now-playing')===track&&track.parentElement.id==='spectrogram-window','returning to 21:9 restores the same track component');
check(style(doc().querySelector('stream-metadata')).display!=='none','21:9 information terminal is restored');
check(style(single).display==='block'&&style(terminal).display==='none'&&single.textContent===originalSingle,'21:9 single-message contents and appearance survive the 16:9 terminal session');
for(let i=0;i<12;i++)terminal.receive({type:'message',id:`wide-qa-${++sequence}`,origin:'local-wide-check',username:'布局切换',message:`21:9 期间收到的历史 ${i}`,timestamp:Date.now()});
await mode('16:9');check(terminal.textContent.includes('21:9 期间收到的历史 11'),'returning to 16:9 preserves the log and includes intervening messages');
check(atTail(),'returning from 21:9 follows the accumulated messages after the panel regains its 16:9 size');
receive('message',{message:'布局切回后新弹幕继续自动滚动'});settleHistory();check(atTail(),'new messages continue following after a layout round trip');
historyFixture();track.update({title:'夜行 LATENITE',artist:'When',playing:true,state:'playing'});
output.textContent=passed.join('\n')+'\n'+passed.length+' checks passed';
}catch(error){output.textContent=passed.join('\n')+'\nFAIL '+error.message}
};
</script></html>

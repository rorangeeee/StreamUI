<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<title>StreamUI 浏览器检查</title>
<style>
  body { margin: 0; padding: 12px; background: #181818; color: #ddd; font: 14px system-ui; }
  button { padding: 8px 14px; margin-right: 8px; }
  iframe { display: block; width: 1280px; height: 720px; border: 0; margin-top: 12px; }
  #results { white-space: pre-wrap; }
  body[data-preview="true"] { padding: 0; }
  body[data-preview="true"] > :not(iframe) { display: none; }
  body[data-preview="true"] > iframe { position: fixed; inset: 0; margin: 0; width: 100vw !important; height: 100vh !important; }
</style>
<button id="run">运行浏览器检查</button>
<button id="half-gift">礼物铺色中点</button>
<button id="full-gift">礼物两行文字</button>
<button id="glow">泛光峰值</button>
<button id="rest">静态布局</button>
<button id="preview-only">仅显示预览</button>
<button id="track-on">曲目差值（亮）</button>
<button id="track-off">曲目差值（灭）</button>
<label>画布预览 <select id="size"><option value="1280,720">1280 × 720</option><option value="1920,1080">1920 × 1080</option><option value="3840,2160">3840 × 2160</option></select></label>
<pre id="results">等待运行</pre>
<iframe id="preview" src="/" title="实际输出页面"></iframe>
<script type="module" src="./browser-check.mjs"></script>
</html>

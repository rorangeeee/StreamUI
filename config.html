<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#f5f5f7"/><link rel="icon" href="/favicon.svg"/><title>StreamUI · 设置</title></head>
<body><div class="console">
  <aside class="sidebar">
    <a class="brand" href="/"><span class="brand-mark">S</span><span>StreamUI</span></a>
    <nav aria-label="设置页面">
      <button type="button" data-section="scenes" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="M8 21h8m-4-4v4"/></svg>场景</button>
      <button type="button" data-section="obs"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="m9 8 7 4-7 4Z"/></svg>OBS</button>
      <button type="button" data-section="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 3v-3a2 2 0 0 1-2-2V6a2 2 0 0 1 3-2Z"/><path d="M7 9h10M7 13h7"/></svg>弹幕</button>
      <button type="button" data-section="plugins"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v5M16 3v5M5 8h14v3a7 7 0 0 1-14 0Zm7 10v4"/></svg>插件</button>
      <button type="button" data-section="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="9" cy="18" r="2"/></svg>设置</button>
    </nav>
    <div class="sidebar-footer"><span class="status-dot" id="host-dot"></span><span id="host-status">正在连接</span></div>
  </aside>
  <main class="app-main">
    <header class="page-heading"><h1 id="page-title">场景</h1><div class="page-actions" id="scene-actions"><button class="button" id="away-button" type="button" disabled>暂离</button><button class="button primary" id="add-scene" type="button" disabled>添加场景</button></div></header>
    <section id="view-scenes" class="view">
      <div class="scene-workspace">
        <div class="scene-list" id="scene-list" aria-label="场景列表"></div>
        <div class="scene-content">
          <section class="card preview-card"><div class="preview-toolbar"><h2 id="preview-title">预览</h2><button class="button primary" id="activate-scene" type="button" disabled>切换到此场景</button></div><div id="stage-viewport"><iframe id="output-frame" title="场景预览" tabindex="-1"></iframe></div><div class="preview-footer"><span id="scene-resolution">1920 × 1080</span><div><button class="text-button" id="reload-preview" type="button">刷新预览</button><button class="text-button" id="copy-url" type="button">复制 OBS 地址</button><button class="text-button" id="open-obs" type="button">打开画面</button></div></div></section>
          <form id="scene-form" class="card form-card" hidden><h2>场景设置</h2><div class="fields-grid">
            <label class="field">名称<input id="scene-name" required maxlength="100"/></label><label class="field">OBS 场景<input id="scene-obs" maxlength="256"/></label>
            <label class="field full">入口文件<input id="scene-entry" required spellcheck="false"/></label>
            <label class="field">宽度<input id="scene-width" type="number" min="320" max="7680" required/></label><label class="field">高度<input id="scene-height" type="number" min="180" max="4320" required/></label>
            <label class="field">转场文件<input id="scene-transition" spellcheck="false"/></label><label class="field">设置页面<input id="scene-settings-page" spellcheck="false"/></label>
          </div><div class="form-actions"><button class="text-button destructive" id="remove-scene" type="button">移除场景</button><button class="button primary" type="submit">保存</button></div></form>
          <section class="card form-card" id="scene-custom-panel" hidden><h2>场景配置</h2><iframe id="scene-config-frame" title="场景配置"></iframe></section>
        </div>
      </div>
    </section>
    <section id="view-obs" class="view narrow" hidden>
      <form id="obs-form" class="card form-card"><div class="card-heading"><h2>OBS 连接</h2><span class="pill" id="obs-status">未连接</span></div>
        <label class="toggle-row"><span>连接 OBS</span><input id="obs-enabled" type="checkbox" role="switch"/></label>
        <label class="field">WebSocket 地址<input id="obs-url" type="url" required spellcheck="false"/></label>
        <label class="field">密码<input id="obs-password" type="password" autocomplete="off"/></label>
        <div class="info-row"><span>当前输出场景</span><output id="obs-current">—</output></div><p class="status-line error" id="obs-error" hidden></p>
        <div class="form-actions"><button class="text-button" id="reconnect-obs" type="button">重新连接</button><button class="button primary" type="submit">保存</button></div>
      </form>
    </section>
    <section id="view-chat" class="view narrow" hidden>
      <form id="chat-form" class="card form-card"><div class="card-heading"><h2>弹幕连接</h2><span class="pill" id="chat-status">未连接</span></div>
        <label class="toggle-row"><span>连接弹幕</span><input id="chat-enabled" type="checkbox" role="switch"/></label>
        <label class="field">Event Bridge 地址<input id="chat-url" type="url" required spellcheck="false"/></label>
        <label class="field">Token<input id="chat-token" type="password" autocomplete="off"/></label>
        <label class="toggle-row"><span>启动本地 Event Bridge</span><input id="chat-local" type="checkbox" role="switch"/></label>
        <div class="info-row"><span>已接收事件</span><output id="chat-count">0</output></div><p class="status-line error" id="chat-error" hidden></p>
        <div class="form-actions"><button class="text-button" id="reconnect-chat" type="button">重新连接</button><button class="button primary" type="submit">保存</button></div>
      </form>
    </section>
    <section id="view-plugins" class="view narrow" hidden>
      <div class="section-heading"><h2>已安装</h2><div class="page-actions"><button class="button" id="open-plugins" type="button">打开插件目录</button><button class="button" id="reload-plugins" type="button">刷新</button></div></div>
      <div id="plugin-list"></div><div class="card empty-state" id="plugin-empty"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v5M16 3v5M5 8h14v3a7 7 0 0 1-14 0Zm7 10v4"/></svg><h2>暂无插件</h2></div>
      <section class="card form-card" id="plugin-panel" hidden><div class="card-heading"><h2 id="plugin-panel-title">插件设置</h2><button class="text-button" id="close-plugin-panel" type="button">关闭</button></div><iframe id="plugin-config-frame" title="插件设置"></iframe><form id="plugin-json-form" hidden><label class="field">JSON 设置<textarea id="plugin-json" rows="10" spellcheck="false"></textarea></label><div class="form-actions"><button class="button primary" type="submit">保存</button></div></form></section>
    </section>
    <section id="view-settings" class="view narrow" hidden>
      <section class="card form-card"><h2>运行</h2><label class="toggle-row"><span>登录 Windows 时启动</span><input id="startup-enabled" type="checkbox" role="switch"/></label><label class="field">暂离场景<select id="away-scene"></select></label><div class="form-actions"><button class="button primary" id="save-away-scene" type="button">保存</button></div></section>
      <section class="card form-card"><h2>用户数据</h2><div class="storage-path" id="data-path">—</div><div class="form-actions"><button class="button" id="open-data" type="button">打开目录</button></div></section>
    </section>
  </main>
</div><div class="feedback" id="feedback" role="status" hidden></div><script type="module" src="/src/config.ts"></script></body></html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <script src="/config-appearance.js"></script><link rel="stylesheet" href="/config-theme.css"/><link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>StreamUI · 设置</title>
  </head>
  <body>
    <div class="console">
      <aside class="sidebar">
        <a class="brand" href="/"><span class="brand-mark">S</span><span>StreamUI</span></a>
        <nav class="tabs" role="tablist" aria-label="控制台页面">
          <button id="tab-preview" role="tab" aria-selected="true" aria-controls="panel-stage" data-tab="preview"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="M8 21h8m-4-4v4"/></svg>预览</button>
          <button id="tab-settings" role="tab" aria-selected="false" aria-controls="panel-settings" data-tab="settings" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="9" cy="18" r="2"/></svg>设置</button>
        </nav>
        <div class="sidebar-footer"><span class="status-dot" id="host-dot"></span><span id="host-status">正在连接</span></div>
      </aside>
      <main class="app-main">
        <section id="panel-stage" role="tabpanel" aria-labelledby="tab-preview">
          <div class="page-heading"><h1>预览</h1><button class="button" id="open-obs" type="button">打开画面</button></div>
          <div class="layout-controls"><label for="layout-mode">直播布局<select id="layout-mode" disabled><option value="21:9">21:9 · 超宽主画面</option><option value="16:9">16:9 · 全画布叠加</option></select></label><span id="layout-mode-detail" hidden>两套布局独立保存</span></div>
          <div class="away-control"><label for="away-enabled">暂离模式<input id="away-enabled" type="checkbox" role="switch" disabled /></label><small id="away-status" role="status">等待 Host 连接</small></div>
          <div class="stage-shell"><div id="stage-viewport"><iframe id="output-frame" title="OBS 实时画面预览" allow="autoplay" tabindex="-1"></iframe></div><div class="stage-footer"><span><span class="live-dot"></span> 实时画面 <span id="canvas-size">3840 × 2160</span></span><span id="layout-status" role="status">已同步</span></div></div>
          <div class="output-address"><div><span class="field-kicker">OBS 浏览器源地址</span><code id="obs-url">正在连接…</code></div><button class="button" id="copy-url" type="button">复制地址</button></div>
        </section>
        <section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
          <div class="page-heading"><h1>设置</h1></div>
          <form id="settings-form">
            <div class="settings-grid">
<section class="card host-card"><div class="card-heading"><h2>外观</h2></div><label class="field">配色<select id="appearance-mode" data-immediate><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">暗色</option></select></label></section>
              <section class="card host-card"><div class="card-heading"><h2>暂离提示</h2></div>
                <label class="toggle-row" for="away-settings-enabled"><span>暂离模式</span><input id="away-settings-enabled" type="checkbox" role="switch" data-immediate disabled /></label>
                <div class="title-fields"><label class="field">第一段文字<input id="away-text-1" type="text" maxlength="500" value="主播暂离片刻，马上回来。" required /></label><label class="field">第二段文字 <input id="away-text-2" type="text" maxlength="500"  /></label></div>
                <label class="field away-opacity-field" for="away-opacity"><span class="range-label">遮罩不透明度 <output id="away-opacity-value">50%</output></span><input id="away-opacity" type="range" min="0" max="100" step="1" value="50" /></label>

              </section>
              <section class="card host-card"><div class="card-heading"><h2>场景自动切换布局</h2><span class="pill" id="obs-scene-status">未启用</span></div>
                <div class="obs-fields"><label class="field">OBS WebSocket 地址<input id="obs-websocket-url" type="url" value="ws://127.0.0.1:4455" spellcheck="false" required /></label><label class="field">OBS WebSocket 密码 <input id="obs-websocket-password" type="password" autocomplete="off" /></label>
                <label class="field">21:9 场景名称<input id="obs-scene-21" type="text" maxlength="256"  /></label><label class="field">16:9 场景名称<input id="obs-scene-16" type="text" maxlength="256"  /></label></div>
                <span id="obs-scene-detail" role="status">配置场景名称后监听 OBS 的实际输出场景和转场。</span>
                <button class="text-button" id="reconnect-obs" type="button">重新连接 OBS</button>
              </section>
              <section class="card host-card"><div class="card-heading"><h2>中英文标题</h2></div><div class="title-fields"><label class="field">英文标题<textarea id="title-english-lines" rows="3" spellcheck="false">TITLE</textarea></label><label class="field">中文标题<textarea id="title-chinese-lines" rows="3">标题</textarea></label></div></section>
              <section class="card host-card"><div class="card-heading"><h2>当前曲目</h2><span class="pill" id="now-playing-status">自动读取</span></div><p class="help" id="now-playing-detail">等待播放器提供曲目信息。</p></section>
              <section class="card"><div class="card-heading"><h2>桌面音频</h2><span class="pill" id="audio-status">等待连接</span></div>
                <label class="toggle-row"><span>启用桌面音频采集</span><input id="audio-enabled" type="checkbox" role="switch" checked /></label>
                <label class="field">输出设备<span class="input-action"><select id="audio-device"><option value="default">跟随 Windows 默认输出</option></select><button class="icon-button" id="refresh-devices" type="button" aria-label="刷新输出设备">↻</button></span></label>
                <label class="field">音频通道<select id="audio-channel"><option value="-1">混合全部声道</option><option value="0">声道 1 · 左</option><option value="1">声道 2 · 右</option></select></label>
                <label class="field" for="audio-gain"><span class="range-label">可视化增益 <output id="gain-value">1.00×</output></span><input id="audio-gain" type="range" min="0" max="4" step="0.05" value="1" /></label>
                <div class="level-row"><span>输入电平</span><meter id="audio-meter" min="0" max="1" value="0" aria-label="桌面音频电平"></meter><code id="audio-level">−∞ dB</code></div>
                <p class="help" id="audio-detail">由 Windows host 获取正在播放的桌面声音，无需共享屏幕。</p><button class="text-button" id="restart-audio" type="button">重新连接音频</button>
              </section>
              <section class="card"><div class="card-heading"><h2>LAPLACE 连接</h2><span class="pill" id="laplace-status">等待连接</span></div>
                <label class="toggle-row"><span>启用弹幕连接</span><input id="laplace-enabled" type="checkbox" role="switch" checked /></label>
                <label class="field">Event Bridge 地址<input id="laplace-url" type="url" value="ws://localhost:9696" required spellcheck="false" /></label>
                <label class="field">Token <input id="laplace-token" type="password" autocomplete="off"  /></label>
                <label class="check-row"><input id="laplace-local" type="checkbox" checked /><span>由 host 自动启动本地 Event Bridge</span></label>

                <div class="bridge-detail"><span>已接收事件 <strong id="event-count">0</strong></span><span id="laplace-detail">等待连接</span></div><button class="text-button" id="reconnect-laplace" type="button">重新连接 LAPLACE</button>
              </section>
              <section class="card host-card"><div class="card-heading"><h2>画布与后台</h2></div><div class="host-options"><div class="resolution"><label class="field">画布宽度<input id="canvas-width" type="number" min="640" max="7680" step="1" value="3840" required /></label><span>×</span><label class="field">画布高度<input id="canvas-height" type="number" min="360" max="4320" step="1" value="2160" required /></label></div><div class="startup-option"><label class="check-row"><input id="startup-enabled" type="checkbox" /><span>登录 Windows 后自动启动 host</span></label></div></div></section>
            </div>
            <div class="savebar"><span id="save-status" role="status">未修改</span><button class="button primary" id="save-settings" type="submit">保存并应用</button></div>
          </form>
        </section>
      </main>

    </div>
    <div id="feedback" class="feedback" role="status" hidden></div>
    <script type="module" src="/src/config.ts"></script>
  </body>
</html>
